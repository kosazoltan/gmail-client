# Deploy utáni smoke: API tartalom (/api/health, /api/auth/login) + frontend (HTML + manifest).
# Csak akkor fut le a main-en, ha a CI sikeresen lefutott (merge/push után).
# Nem helyettesíti a Render healthCheckPath-ot.
#
# Opcionális repo változók (Settings → Secrets and variables → Actions → Variables):
#   ZMAIL_API_BASE          — pl. https://api.mindenes.org
#   ZMAIL_API_HEALTH_URL    — teljes health URL (felülírja a BASE + /api/health-et, ha kell)
#   ZMAIL_FRONTEND_URL      — pl. https://mail.mindenes.org/
#   VERIFY_SKIP_INITIAL_SLEEP — "1" esetén nincs 45s kezdeti várakozás (workflow_dispatch gyors teszt)
#
# Kötelező / ajánlott Secret (Actions → Secrets and variables → Secrets):
#   RENDER_API_KEY          — Render REST API kulcs. Ha be van állítva, a workflow CI után
#                             explicit deployt indít a gmail-client-api service-re és megvárja.
#   DEPLOY_HEALTHCHECK_URL  — pl. Render Deploy Hook URL (Dashboard → service → Deploy → Deploy Hook),
#                             vagy külső ping/webhook. A sikeres verify-production UTÁN egy GET hívás
#                             (token az URL-ben — ezért Secret, ne Variable!). Üres = lépés kihagyva.
#
name: Deploy healthcheck

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-healthcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout (workflow_run: a CI által tesztelt commit)"
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}

      - name: Render deploy — gmail-client-api
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_NAME: ${{ vars.RENDER_SERVICE_NAME || 'gmail-client-api' }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "RENDER_API_KEY nincs beállítva — explicit Render deploy kihagyva."
            exit 0
          fi
          python3 scripts/render-deploy.py

      - name: Production — tartalmi ellenőrzés (API + frontend)
        env:
          ZMAIL_API_BASE: ${{ vars.ZMAIL_API_BASE }}
          ZMAIL_API_HEALTH_URL: ${{ vars.ZMAIL_API_HEALTH_URL }}
          ZMAIL_FRONTEND_URL: ${{ vars.ZMAIL_FRONTEND_URL }}
          VERIFY_SKIP_INITIAL_SLEEP: ${{ vars.VERIFY_SKIP_INITIAL_SLEEP }}
          # A zöld healthcheck csak akkor érvényes, ha tényleg az ÚJ commit fut élesben.
          ZMAIL_EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: python3 scripts/verify-production.py

      - name: Deploy healthcheck URL (secret hook / ping)
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          set -e
          if [ -z "${DEPLOY_HEALTHCHECK_URL}" ]; then
            echo "DEPLOY_HEALTHCHECK_URL nincs beállítva — hook lépés kihagyva."
            exit 0
          fi
          echo "Opcionális hook meghívása (URL nem naplózva)…"
          curl -fsS --max-time 120 -A "ZMail-GitHubActions-DeployHealthcheck/1.0" \
            -H "Accept: */*" \
            "$DEPLOY_HEALTHCHECK_URL"
          echo "Hook kész (HTTP siker)."
