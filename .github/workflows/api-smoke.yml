# Opcionális: ellenőrzi, hogy a GitHub / Render API kulcsok (Secrets) élnek-e.
# Futtatás: Actions → API secrets smoke → Run workflow
# Titkok: RENDER_API_KEY, GITHUB_PAT — feltöltés: docs/CI-SECRETS.md vagy npm run secrets:sync-github
name: API secrets smoke

on:
  workflow_dispatch:

jobs:
  render-api:
    runs-on: ubuntu-latest
    steps:
      - name: Render API (Bearer rnd_…)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::notice::RENDER_API_KEY nincs GitHub Secrets-ben — job kihagyva."
            exit 0
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services?limit=1")"
          echo "Render API HTTP ${code}"
          test "$code" = "200"

  github-pat:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub API (GITHUB_PAT)
        env:
          GH_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          set -e
          if [ -z "$GH_PAT" ]; then
            echo "::notice::GITHUB_PAT nincs GitHub Secrets-ben — job kihagyva."
            exit 0
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user")"
          echo "GitHub API HTTP ${code}"
          test "$code" = "200"
