name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: cd server && npm ci
      - run: cd server && npm run lint
      - run: cd server && npx tsc --noEmit
      - run: cd server && npm run build

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - run: cd client && npm run lint
      - run: cd client && npx tsc --noEmit
      - run: cd client && npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - name: Start mock backend for unmocked /api routes
        run: |
          node -e "const http=require('http');const server=http.createServer((req,res)=>{res.setHeader('Content-Type','application/json');res.end('{}');});server.listen(5000,'127.0.0.1',()=>console.log('Mock backend listening on 5000'));setInterval(()=>{},1<<30);" > /tmp/mock-backend.log 2>&1 &
          sleep 1
          curl -sSf http://127.0.0.1:5000 >/dev/null
      - run: cd client && npx playwright install --with-deps chromium
      - run: cd client && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
