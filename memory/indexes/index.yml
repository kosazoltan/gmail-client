# ZMail Memory Index — master catalog
# Regeneralhato: node memory/search.mjs --reindex
# Utolso frissites: 2026-07-25

collections:
  - name: memory-semantic
    description: "Stabil tenyek, architektura, konfiguracio, kapcsolatok"
    path: memory/semantic
    query_hint: "Ki/mi/mit tudunk errol?"

  - name: memory-episodic
    description: "Esemenyek, incidensek, migraciok, idovonalak"
    path: memory/episodic
    query_hint: "Mi tortent? Mikor? Mi valtozot?"

  - name: memory-procedural
    description: "Hogyan kell csinalni, workflow-k, szabalyok, checklist-ek"
    path: memory/procedural
    query_hint: "Hogyan? Mit kell csinalni? Mi a szabaly?"

  - name: memory-projects
    description: "Aktiv celok, tiltasok, dontesek, nyitott kerdesek"
    path: memory/projects
    query_hint: "Min dolgozunk? Mi a statusz? Mi a kovetkezo?"

  - name: memory-wiki
    description: "Osszefoglalo oldalak, entitasok, temak"
    path: memory/wiki
    query_hint: "Adj attekinteset errol a temarol"

