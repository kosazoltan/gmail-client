# Render Blueprint - Gmail Client Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gmail-client-backend
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: gmail-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://mail.mindenes.org
      - key: BACKEND_URL
        value: https://api.mindenes.org
      - key: GOOGLE_REDIRECT_URI
        value: https://api.mindenes.org/api/auth/callback
      - key: DATABASE_URL
        value: /data/gmail-client.db
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false