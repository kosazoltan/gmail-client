# Render Blueprint — web service: gmail-client-api
#
# DATABASE_URL (kötelező a Dashboardon, sync: false = titkos érték):
#   A dedikált ZMail Neon connection string (pooler), pl. host:
#   ep-empty-hill-abv67xx3-pooler.eu-west-2.aws.neon.tech / adatbázis: neondb
#   Illeszd be egy az egyben a Neon Console → Connection details → pooled string.
#   A szerver induláskor futtatja a PostgreSQL sémát (initializeDatabase).
#
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gmail-client-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: gmail-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://mail.mindenes.org
      - key: BACKEND_URL
        value: https://api.mindenes.org
      - key: GOOGLE_REDIRECT_URI
        value: https://api.mindenes.org/api/auth/callback
      # Neon / Postgres — Render Dashboard-on gyakran DATABASE_URL néven (ugyanaz a connection string)
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false